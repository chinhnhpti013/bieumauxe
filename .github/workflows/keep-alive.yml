name: Keep Render server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf -m 30 https://bieumauxe-2.onrender.com/ -o /dev/null && echo "OK" || echo "Ping thất bại (server có thể đang khởi động lại)"
